{# Auth JS — token management & API fetch for Identidad.
   Expects: BASE variable already defined.
   Included only in authenticated pages (NOT login).
   Uses id_token / id_user keys (distinct from the email service's ms_token). #}
<script>
  // ========================================================================
  // AUTH & API
  // ========================================================================
  const API_BASE = BASE + '/api/v1';

  function getToken() { return localStorage.getItem('id_token'); }
  function setToken(t) { localStorage.setItem('id_token', t); }
  function clearToken() { localStorage.removeItem('id_token'); localStorage.removeItem('id_user'); }

  function getUser() {
    try { return JSON.parse(localStorage.getItem('id_user')); } catch { return null; }
  }

  async function apiFetch(path, opts = {}) {
    const token = getToken();
    if (!token) { goLogin(); return null; }
    const maxRetries = opts._retries ?? 3;
    for (let attempt = 1; attempt <= maxRetries; attempt++) {
      try {
        const { _retries: _r, ...fetchOpts } = opts;
        const resp = await fetch(API_BASE + path, {
          ...fetchOpts,
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/json',
            ...(opts.headers || {}),
          },
        });
        if (resp.status === 401 || resp.status === 403) { goLogin(); return null; }
        if ((resp.status === 502 || resp.status === 503) && attempt < maxRetries) {
          await new Promise(r => setTimeout(r, Math.min(1000 * Math.pow(2, attempt - 1), 8000)));
          continue;
        }
        return resp;
      } catch (e) {
        if (attempt === maxRetries) throw e;
        await new Promise(r => setTimeout(r, Math.min(1000 * Math.pow(2, attempt - 1), 8000)));
      }
    }
    return null;
  }

  function goLogin() {
    clearToken();
    window.location.href = BASE + '/dashboard/login';
  }

  function logout() { goLogin(); }

  // ========================================================================
  // SHELL INIT — set user info in sidebar
  // ========================================================================
  (function initShell() {
    if (!getToken()) { goLogin(); return; }
    const user = getUser();
    if (user) {
      const nameEl = document.getElementById('user-name');
      const roleEl = document.getElementById('user-role');
      const initEl = document.getElementById('user-initials');
      if (nameEl) nameEl.textContent = user.userName || 'Admin';
      if (roleEl) roleEl.textContent = user.role || 'admin';
      if (initEl) initEl.textContent = (user.userName || 'A')[0].toUpperCase();
    }
  })();

  // Fallback for pages that don't define their own refreshCurrentPage
  if (typeof refreshCurrentPage === 'undefined') {
    window.refreshCurrentPage = function() { window.location.reload(); };
  }
</script>
