[pytest]
# Pytest configuration for Identity Service

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto
    --color=yes
    -ra

# Markers
markers =
    asyncio: mark test as async
    integration: mark test as integration test
    slow: mark test as slow running
    unit: mark test as unit test
    e2e: mark test as end-to-end test
    ldap: mark test as requiring LDAP connection

# Async settings
asyncio_mode = auto

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*
    */app/main.py
    */app/core/middleware.py
    */app/core/dependencies.py
    */app/core/exception_handlers.py
    */app/core/health.py
    */app/core/responses.py
    */app/core/db_manager.py
