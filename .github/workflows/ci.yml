name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: identity_user
          POSTGRES_PASSWORD: ci-db-password
          POSTGRES_DB: identity_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U identity_user" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for the CI database only.
      SECRET_KEY: ci-only-signing-key-0123456789abcdef0123456789
      DB_HOST: localhost
      DB_USER: identity_user
      DB_PASSWORD: ci-db-password
      DB_NAME: identity_db
      REDIS_HOST: localhost
      ADMIN_USER: ci-admin
      ADMIN_PASSWORD: ci-admin-password-123
      ADMIN_EMAIL: ci-admin@example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest -q
